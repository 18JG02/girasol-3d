<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Feliz Día de las Flores Amarillas 🌻</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Nunito+Sans:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#fff6df;
    box-sizing:border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html{ height:100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  *{ box-sizing:border-box; }
  body{
    margin:0; height:100%; min-height:100vh;
    background:#020103;
    overflow:hidden;
    font-family:'Nunito Sans', sans-serif;
    color:var(--cream);
  }
  #canvasWrap{ position:fixed; inset:0; }
  canvas{ display:block; touch-action:none; }

  header{
    position:absolute; top:0; left:0; right:0;
    padding: calc(env(safe-area-inset-top,0px) + 30px) 20px 0;
    text-align:center; z-index:10; pointer-events:none;
    opacity:0; animation: fadeIn 2.2s ease-out .4s forwards;
  }
  header h1{
    margin:0; font-family:'Playfair Display', serif; font-weight:600; font-style:italic;
    font-size: clamp(20px, 4.2vw, 38px);
    text-shadow: 0 0 22px rgba(255,190,60,.5);
  }
  header p{
    margin:8px 0 0; font-size: clamp(11px, 1.5vw, 14px);
    color:#e7d9b0; font-weight:300; letter-spacing:.4px;
  }

  #bigMessage{
    position:absolute; left:0; right:0; bottom:14%;
    text-align:center; z-index:12; pointer-events:none;
    padding: 0 6vw;
    opacity:0; transform: translateY(18px) scale(.92);
    transition: opacity 1.6s ease, transform 1.6s cubic-bezier(.2,.9,.25,1);
  }
  #bigMessage.show{ opacity:1; transform: translateY(0) scale(1); }
  #bigMessage h2{
    margin:0; font-family:'Playfair Display', serif; font-weight:700; font-style:italic;
    font-size: clamp(24px, 6vw, 56px);
    line-height:1.15;
    color:#fff9e8;
    text-shadow:
      0 0 18px rgba(255,214,90,.9),
      0 0 40px rgba(255,150,20,.55),
      0 0 80px rgba(255,150,20,.3);
  }
  #bigMessage p{
    margin: 14px 0 0; font-size: clamp(12px, 1.7vw, 16px);
    color: rgba(255,246,223,.75); font-weight:300; letter-spacing:.4px;
    opacity:0; transition: opacity 1.4s ease 1s;
  }
  #bigMessage.show p{ opacity:1; }

  #hint{
    position:absolute; left:0; right:0; bottom: calc(env(safe-area-inset-bottom,0px) + 18px);
    text-align:center; z-index:10; pointer-events:none;
    font-size: clamp(10px, 1.4vw, 12px);
    color: rgba(255,246,223,.4);
    letter-spacing:.5px;
    opacity:0; transition: opacity 1.4s ease;
  }
  #hint.show{ opacity:1; }

  @keyframes fadeIn{ from{opacity:0; transform:translateY(-6px);} to{opacity:1; transform:translateY(0);} }

  #loader{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    background:#020103; z-index:50; transition: opacity .8s ease;
    font-family:'Nunito Sans', sans-serif; color:#e7d9b0; font-size:14px; letter-spacing:.5px;
  }
  #loader.hide{ opacity:0; pointer-events:none; }

  @media (prefers-reduced-motion: reduce){
    #bigMessage, header{ transition-duration:.01ms !important; animation-duration:.01ms !important; }
  }
</style>
</head>
<body>

<div id="canvasWrap"></div>

<div id="loader">preparando el jardín&hellip;</div>

<header>
  <h1>Feliz Día de las Flores Amarillas</h1>
  <p>21 de septiembre &middot; un universo de amistad y girasoles</p>
</header>

<div id="bigMessage">
  <h2>No te iba a dejar ser espectadora</h2>
  <p>toca la pantalla, tú también haces florecer esto</p>
</div>

<div id="hint">gira suavemente el dedo o el mouse para mirar alrededor</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
  "use strict";
  var wrap = document.getElementById('canvasWrap');
  var isMobile = Math.min(window.innerWidth, window.innerHeight) < 560;

  // ---------------------------------------------------------------
  // Renderer / Scene / Camera
  // ---------------------------------------------------------------
  var renderer = new THREE.WebGLRenderer({ antialias:true, alpha:false });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, isMobile ? 1.6 : 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  wrap.appendChild(renderer.domElement);

  var scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x03020a, 0.012);

  var camera = new THREE.PerspectiveCamera(52, window.innerWidth/window.innerHeight, 0.1, 300);
  var camDist = isMobile ? 34 : 30;
  camera.position.set(0, 9, camDist);

  window.addEventListener('resize', function(){
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  // ---------------------------------------------------------------
  // Texture helpers (procedural, canvas based)
  // ---------------------------------------------------------------
  function makeRadialTexture(stops, size){
    size = size || 256;
    var c = document.createElement('canvas'); c.width = c.height = size;
    var ctx = c.getContext('2d');
    var g = ctx.createRadialGradient(size/2,size/2,0, size/2,size/2,size/2);
    stops.forEach(function(s){ g.addColorStop(s[0], s[1]); });
    ctx.fillStyle = g;
    ctx.fillRect(0,0,size,size);
    var tex = new THREE.CanvasTexture(c);
    tex.needsUpdate = true;
    return tex;
  }

  function makeDiskTexture(size, dark1, dark2, dark3){
    size = size || 256;
    var c = document.createElement('canvas'); c.width = c.height = size;
    var ctx = c.getContext('2d');
    var g = ctx.createRadialGradient(size*0.4,size*0.38,size*0.02, size/2,size/2,size/2);
    g.addColorStop(0, dark1); g.addColorStop(0.55, dark2); g.addColorStop(1, dark3);
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(size/2,size/2,size/2,0,Math.PI*2); ctx.fill();

    var golden = Math.PI * (3 - Math.sqrt(5));
    var n = 340, R = size*0.47;
    for(var i=0;i<n;i++){
      var r = R * Math.sqrt(i/n);
      var a = i * golden;
      var x = size/2 + r*Math.cos(a);
      var y = size/2 + r*Math.sin(a);
      var d = 2 + (r/R)*3.2;
      var shade = 0.55 + 0.35*Math.sin(i*0.7);
      ctx.fillStyle = 'rgba('+Math.floor(30+shade*40)+','+Math.floor(18+shade*22)+','+Math.floor(6+shade*10)+',0.9)';
      ctx.beginPath(); ctx.ellipse(x,y,d*0.6,d,a,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = 'rgba(255,210,120,0.18)';
      ctx.beginPath(); ctx.ellipse(x-d*0.15,y-d*0.15,d*0.22,d*0.32,a,0,Math.PI*2); ctx.fill();
    }
    // faint yellow ring near the edge, like tiny disc florets about to open
    ctx.strokeStyle = 'rgba(255,196,60,0.35)';
    ctx.lineWidth = size*0.012;
    ctx.beginPath(); ctx.arc(size/2,size/2,size*0.46,0,Math.PI*2); ctx.stroke();

    var tex = new THREE.CanvasTexture(c);
    tex.needsUpdate = true;
    return tex;
  }

  function makeFlowerIconTexture(petalColor1, petalColor2, centerColor){
    var size = 128;
    var c = document.createElement('canvas'); c.width = c.height = size;
    var ctx = c.getContext('2d');
    var cx = size/2, cy = size/2;
    var petals = 10, petalLen = size*0.40, petalW = size*0.20;
    for(var i=0;i<petals;i++){
      var a = (i/petals)*Math.PI*2;
      ctx.save();
      ctx.translate(cx,cy); ctx.rotate(a);
      var grad = ctx.createLinearGradient(0,0,0,-petalLen);
      grad.addColorStop(0, petalColor1); grad.addColorStop(1, petalColor2);
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.moveTo(0,0);
      ctx.bezierCurveTo(petalW*0.5,-petalLen*0.25, petalW*0.4,-petalLen*0.8, 0,-petalLen);
      ctx.bezierCurveTo(-petalW*0.4,-petalLen*0.8, -petalW*0.5,-petalLen*0.25, 0,0);
      ctx.fill();
      ctx.restore();
    }
    var cg = ctx.createRadialGradient(cx-4,cy-4,1,cx,cy,size*0.17);
    cg.addColorStop(0,'#8a5a26'); cg.addColorStop(1,centerColor);
    ctx.fillStyle = cg;
    ctx.beginPath(); ctx.arc(cx,cy,size*0.16,0,Math.PI*2); ctx.fill();
    var tex = new THREE.CanvasTexture(c);
    tex.needsUpdate = true;
    return tex;
  }

  var glowTexSoft = makeRadialTexture([[0,'rgba(255,236,170,0.95)'],[0.4,'rgba(255,195,80,0.55)'],[1,'rgba(255,150,20,0)']]);
  var glowTexHot  = makeRadialTexture([[0,'rgba(255,240,200,1)'],[0.3,'rgba(255,160,60,0.7)'],[1,'rgba(255,120,20,0)']]);
  var starTex     = makeRadialTexture([[0,'rgba(255,255,255,1)'],[0.5,'rgba(255,255,255,0.6)'],[1,'rgba(255,255,255,0)']]);
  var sunDiskTex   = makeDiskTexture(300, '#5a3618', '#3a220e', '#1c1006');
  var planetDiskTex= makeDiskTexture(200, '#6b4423', '#4a2c12', '#241407');
  var meteorTex    = makeFlowerIconTexture('#fff2b8', '#ffb627', '#3b240f');

  // ---------------------------------------------------------------
  // Flower builder (used for sun + planets)
  // ---------------------------------------------------------------
  function petalShape(length, width){
    var s = new THREE.Shape();
    s.moveTo(0,0);
    s.bezierCurveTo(width*0.55, length*0.18, width*0.5, length*0.78, 0, length);
    s.bezierCurveTo(-width*0.5, length*0.78, -width*0.55, length*0.18, 0, 0);
    return s;
  }

  // Bends a flat petal into a gentle spoon/curl shape and paints a base-to-tip
  // color gradient onto it, so it reads as an actual petal instead of a flat cutout.
  function shapePetalGeometry(geo, length, curveAmount, baseColor, tipColor){
    var pos = geo.attributes.position;
    var c1 = new THREE.Color(baseColor), c2 = new THREE.Color(tipColor);
    var colors = new Float32Array(pos.count*3);
    for(var i=0;i<pos.count;i++){
      var y = pos.getY(i);
      var t = Math.max(0, Math.min(1, y/length));
      // gentle upward/backward curl that increases toward the tip
      var curl = curveAmount * t * t;
      pos.setZ(i, pos.getZ(i) + curl);
      // faint center crease so the petal isn't perfectly flat across its width
      var x = pos.getX(i);
      pos.setZ(i, pos.getZ(i) - x*x*0.05);
      var col = c1.clone().lerp(c2, t);
      colors[i*3] = col.r; colors[i*3+1] = col.g; colors[i*3+2] = col.b;
    }
    geo.setAttribute('color', new THREE.BufferAttribute(colors,3));
    geo.attributes.position.needsUpdate = true;
    geo.computeVertexNormals();
    return geo;
  }

  function buildFlower(opts){
    var size = opts.size;
    var group = new THREE.Group();

    function addLayer(count, lenR, widR, tiltX, zOff, colorBase, colorTip, offsetAngle, curveAmount){
      var length = size*lenR, width = size*widR;
      var shape = petalShape(length, width);
      var geo = new THREE.ExtrudeGeometry(shape, {
        depth: size*0.05, bevelEnabled:true,
        bevelThickness: size*0.018, bevelSize: size*0.014, bevelSegments:3, curveSegments:10
      });
      shapePetalGeometry(geo, length, curveAmount, colorBase, colorTip);
      var mat = new THREE.MeshStandardMaterial({
        vertexColors:true, roughness:0.48, metalness:0.02, side: THREE.DoubleSide,
        emissive: new THREE.Color(colorTip), emissiveIntensity:0.12
      });
      for(var i=0;i<count;i++){
        var angle = (i/count)*Math.PI*2 + (offsetAngle||0);
        var petal = new THREE.Mesh(geo, mat);
        petal.rotation.set(tiltX, 0, angle);
        petal.position.set(0,0,zOff);
        group.add(petal);
      }
    }

    // outer layer: long petals, curling back and up, orange base fading to bright yellow tip
    addLayer(opts.petalsOuter, 0.66, 0.30, -0.30, -size*0.03, opts.outerColor2, opts.outerColor1, 0, size*0.16);
    // inner layer: shorter, staggered between the outer ones, sits closer to the disk
    addLayer(opts.petalsInner, 0.44, 0.25, -0.44, -size*0.008, opts.innerColor2, opts.innerColor1, Math.PI/opts.petalsOuter, size*0.10);

    var diskR = size*opts.diskRatio;
    var diskGeo = new THREE.CylinderGeometry(diskR, diskR, size*0.07, 56, 1);
    diskGeo.rotateX(Math.PI/2);
    var diskMat = new THREE.MeshStandardMaterial({ map: opts.diskTex, roughness:0.95, metalness:0 });
    var disk = new THREE.Mesh(diskGeo, diskMat);
    disk.position.z = size*0.012;
    group.add(disk);

    // small ring of bright short florets right at the disk edge for extra realism
    var floretCount = Math.round(opts.petalsOuter*1.4);
    var floretGeo = new THREE.ConeGeometry(size*0.02, size*0.06, 6);
    var floretMat = new THREE.MeshStandardMaterial({ color: opts.innerColor1, roughness:0.5 });
    for(var f=0; f<floretCount; f++){
      var fa = (f/floretCount)*Math.PI*2;
      var floret = new THREE.Mesh(floretGeo, floretMat);
      var fr = diskR*0.92;
      floret.position.set(Math.cos(fa)*fr, Math.sin(fa)*fr, size*0.03);
      floret.rotation.x = Math.PI/2 + 0.5;
      floret.rotation.z = fa;
      group.add(floret);
    }

    return group;
  }

  // ---------------------------------------------------------------
  // Lights
  // ---------------------------------------------------------------
  scene.add(new THREE.AmbientLight(0x352614, 0.65));
  var sunLight = new THREE.PointLight(0xffd66a, 2.2, 90, 2);
  sunLight.position.set(0,0,0);
  scene.add(sunLight);
  var keyLight = new THREE.DirectionalLight(0xfff2cf, 0.9);
  keyLight.position.set(6, 10, 16);
  scene.add(keyLight);
  var fill = new THREE.DirectionalLight(0x9aa5ff, 0.3);
  fill.position.set(-10, -4, -10);
  scene.add(fill);

  // ---------------------------------------------------------------
  // The Sun — a big, dense sunflower
  // ---------------------------------------------------------------
  var sunSize = isMobile ? 7.2 : 9.2;
  var sunGroup = buildFlower({
    size: sunSize,
    petalsOuter: 21, petalsInner: 21,
    outerColor1: 0xffd84d, outerColor2: 0xf2960c,
    innerColor1: 0xffb627, innerColor2: 0xe8871e,
    diskRatio: 0.30, diskTex: sunDiskTex
  });
  var sunFacing = new THREE.Group();
  sunFacing.add(sunGroup);
  scene.add(sunFacing);

  var sunGlow = new THREE.Sprite(new THREE.SpriteMaterial({
    map: glowTexSoft, color:0xffffff, transparent:true, blending:THREE.AdditiveBlending, depthWrite:false
  }));
  sunGlow.scale.set(sunSize*3.6, sunSize*3.6, 1);
  scene.add(sunGlow);

  // ---------------------------------------------------------------
  // Flower planets in orbit
  // ---------------------------------------------------------------
  var planetPalettes = [
    { outer1:0xfff3c4, outer2:0xffd84d, inner1:0xffe9a0, inner2:0xffc93c },
    { outer1:0xffe28a, outer2:0xd97706, inner1:0xffc93c, inner2:0xe8871e },
    { outer1:0xfff7d6, outer2:0xf2960c, inner1:0xffe28a, inner2:0xffb627 },
    { outer1:0xffb627, outer2:0xb45309, inner1:0xffd84d, inner2:0xd97706 }
  ];
  var planetDefs = [
    { radius: isMobile? 11: 13, size: isMobile?1.3:1.7, speed:0.16, tilt:0.10, spin:0.5 },
    { radius: isMobile? 15: 18, size: isMobile?1.7:2.2, speed:0.10, tilt:-0.16, spin:0.35 },
    { radius: isMobile? 19: 23, size: isMobile?1.1:1.4, speed:0.075,tilt:0.22, spin:0.6 },
    { radius: isMobile? 23: 28, size: isMobile?2.0:2.6, speed:0.05, tilt:-0.08, spin:0.28 }
  ];

  var orbits = [];
  planetDefs.forEach(function(def, idx){
    var pal = planetPalettes[idx % planetPalettes.length];
    var flower = buildFlower({
      size: def.size,
      petalsOuter: 13, petalsInner: 13,
      outerColor1: pal.outer1, outerColor2: pal.outer2,
      innerColor1: pal.inner1, innerColor2: pal.inner2,
      diskRatio: 0.34, diskTex: planetDiskTex
    });
    var holder = new THREE.Group();
    flower.position.set(def.radius, 0, 0);
    holder.add(flower);

    var pivot = new THREE.Group();
    pivot.rotation.x = def.tilt;
    pivot.rotation.y = Math.random()*Math.PI*2;
    pivot.add(holder);
    scene.add(pivot);

    // orbit ring
    var ringGeo = new THREE.RingGeometry(def.radius-0.03, def.radius+0.03, 128);
    var ringMat = new THREE.MeshBasicMaterial({ color:0xffd66a, transparent:true, opacity:0.12, side:THREE.DoubleSide });
    var ring = new THREE.Mesh(ringGeo, ringMat);
    ring.rotation.x = Math.PI/2;
    var ringHolder = new THREE.Group();
    ringHolder.rotation.x = def.tilt;
    ringHolder.add(ring);
    scene.add(ringHolder);

    orbits.push({ pivot:pivot, flower:flower, speed:def.speed, spin:def.spin });
  });

  // ---------------------------------------------------------------
  // Starfield
  // ---------------------------------------------------------------
  var starCount = isMobile ? 700 : 1400;
  var starGeo = new THREE.BufferGeometry();
  var starPos = new Float32Array(starCount*3);
  for(var i=0;i<starCount;i++){
    var r = 60 + Math.random()*140;
    var theta = Math.random()*Math.PI*2;
    var phi = Math.acos(2*Math.random()-1);
    starPos[i*3]   = r*Math.sin(phi)*Math.cos(theta);
    starPos[i*3+1] = r*Math.cos(phi);
    starPos[i*3+2] = r*Math.sin(phi)*Math.sin(theta);
  }
  starGeo.setAttribute('position', new THREE.BufferAttribute(starPos,3));
  var starMat = new THREE.PointsMaterial({ size: isMobile?1.4:1.7, map:starTex, transparent:true, depthWrite:false, color:0xfff6df, sizeAttenuation:true });
  var stars = new THREE.Points(starGeo, starMat);
  scene.add(stars);

  // ---------------------------------------------------------------
  // Meteor shower: sunflower-shaped asteroids
  // ---------------------------------------------------------------
  var meteors = [];
  var MAX_METEORS = isMobile ? 16 : 26;

  function spawnMeteor(){
    if(meteors.length >= MAX_METEORS) return;
    var x = (Math.random()-0.5) * (isMobile?26:38);
    var z = (Math.random()-0.5) * 24 - 4;
    var y = 34 + Math.random()*14;
    var s = 0.9 + Math.random()*1.4;

    var sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: meteorTex, transparent:true, depthWrite:false }));
    sprite.scale.set(s,s,1);
    sprite.position.set(x,y,z);
    scene.add(sprite);

    var glow = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTexHot, color:0xffb347, transparent:true, blending:THREE.AdditiveBlending, depthWrite:false, opacity:0.7 }));
    glow.scale.set(s*3.2, s*3.2, 1);
    glow.position.copy(sprite.position);
    scene.add(glow);

    meteors.push({
      sprite: sprite, glow: glow,
      vy: -(9 + Math.random()*7),
      spin: (Math.random()-0.5) * 3.2,
      rot: Math.random()*Math.PI*2
    });
  }

  var showerStarted = false;
  var burstInterval = null;
  function startMeteorShower(){
    if(showerStarted) return;
    showerStarted = true;
    // intense initial burst
    for(var i=0;i<26;i++){
      (function(delay){ setTimeout(spawnMeteor, delay); })(i*70);
    }
    // gentle ongoing sprinkle
    burstInterval = setInterval(spawnMeteor, 850);
  }

  // ---------------------------------------------------------------
  // Reveal sequence: at 10s, message + meteor shower together
  // ---------------------------------------------------------------
  var bigMessage = document.getElementById('bigMessage');
  var hint = document.getElementById('hint');
  setTimeout(function(){
    startMeteorShower();
    bigMessage.classList.add('show');
    setTimeout(function(){ hint.classList.add('show'); }, 1600);
  }, 10000);

  // ---------------------------------------------------------------
  // Click / tap interaction — you are not just watching
  // ---------------------------------------------------------------
  var bursts = [];
  function spawnBurst(nx, ny){
    // unproject a point roughly in front of the camera near the click direction
    var vector = new THREE.Vector3(nx, ny, 0.5);
    vector.unproject(camera);
    var dir = vector.sub(camera.position).normalize();
    var dist = 14 + Math.random()*6;
    var origin = camera.position.clone().add(dir.multiplyScalar(dist));

    for(var i=0;i<10;i++){
      var petalSprite = new THREE.Sprite(new THREE.SpriteMaterial({
        map: meteorTex, transparent:true, depthWrite:false, blending:THREE.AdditiveBlending, opacity:0.95
      }));
      var s = 0.35 + Math.random()*0.5;
      petalSprite.scale.set(s,s,1);
      petalSprite.position.copy(origin);
      scene.add(petalSprite);
      var vel = new THREE.Vector3((Math.random()-0.5), (Math.random()*0.6+0.2), (Math.random()-0.5)).multiplyScalar(6);
      bursts.push({ sprite: petalSprite, vel: vel, life: 0, maxLife: 1.1 + Math.random()*0.6 });
    }
  }
  function onPointerDown(ev){
    var x, y;
    if(ev.touches && ev.touches.length){ x = ev.touches[0].clientX; y = ev.touches[0].clientY; }
    else { x = ev.clientX; y = ev.clientY; }
    var nx = (x / window.innerWidth) * 2 - 1;
    var ny = -(y / window.innerHeight) * 2 + 1;
    spawnBurst(nx, ny);
  }
  renderer.domElement.addEventListener('pointerdown', onPointerDown);

  // ---------------------------------------------------------------
  // Gentle parallax look-around
  // ---------------------------------------------------------------
  var pointerX = 0, pointerY = 0;
  window.addEventListener('pointermove', function(e){
    pointerX = (e.clientX / window.innerWidth) - 0.5;
    pointerY = (e.clientY / window.innerHeight) - 0.5;
  });

  // ---------------------------------------------------------------
  // Animation loop
  // ---------------------------------------------------------------
  var clock = new THREE.Clock();
  var camAngle = Math.PI*0.15;

  function animate(){
    requestAnimationFrame(animate);
    var delta = Math.min(clock.getDelta(), 0.05);
    var t = clock.elapsedTime;

    sunGroup.rotation.z += delta*0.05;
    var pulse = 1 + Math.sin(t*1.1)*0.05;
    sunGlow.scale.set(sunSize*3.6*pulse, sunSize*3.6*pulse, 1);
    sunLight.intensity = 2.6 + Math.sin(t*1.1)*0.3;

    orbits.forEach(function(o){
      o.pivot.rotation.y += delta*o.speed;
    });

    stars.rotation.y += delta*0.004;

    for(var i=meteors.length-1;i>=0;i--){
      var m = meteors[i];
      m.sprite.position.y += m.vy*delta;
      m.rot += m.spin*delta;
      m.sprite.material.rotation = m.rot;
      m.glow.position.copy(m.sprite.position);
      if(m.sprite.position.y < -22){
        scene.remove(m.sprite); scene.remove(m.glow);
        meteors.splice(i,1);
      }
    }

    for(var j=bursts.length-1;j>=0;j--){
      var b = bursts[j];
      b.life += delta;
      b.sprite.position.addScaledVector(b.vel, delta);
      b.vel.y -= delta*2.2;
      var fade = 1 - (b.life/b.maxLife);
      b.sprite.material.opacity = Math.max(fade,0);
      if(b.life >= b.maxLife){
        scene.remove(b.sprite);
        bursts.splice(j,1);
      }
    }

    camAngle += delta*0.045;
    var targetX = Math.sin(camAngle)*camDist + pointerX*3;
    var targetZ = Math.cos(camAngle)*camDist;
    var targetY = 9 + Math.sin(camAngle*0.3)*1.6 - pointerY*2.4;
    camera.position.x += (targetX - camera.position.x)*0.03;
    camera.position.y += (targetY - camera.position.y)*0.03;
    camera.position.z += (targetZ - camera.position.z)*0.03;
    camera.lookAt(0,0,0);

    // keep every flower facing the camera as it orbits, so it never reads as a
    // paper-thin wafer seen edge-on — the flower's own spin still happens locally
    sunFacing.lookAt(camera.position);
    sunFacing.rotateY(Math.PI);
    orbits.forEach(function(o){
      o.flower.lookAt(camera.position);
      o.flower.rotateY(Math.PI);
      o.flower.rotation.z += delta*o.spin;
    });

    renderer.render(scene, camera);
  }

  animate();
  requestAnimationFrame(function(){
    document.getElementById('loader').classList.add('hide');
  });
})();
</script>
</body>
</html>
